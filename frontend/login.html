<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Login - Explore Bosnia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet" />
  <link href="assets/css/login.css" rel="stylesheet" />
</head>

<body class="bg-light">

<section class="page-section bg-light min-vh-100 d-flex align-items-center" id="login">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-lg-6 col-md-8">

        <h2 class="text-center mt-0 fw-bold">Welcome back!</h2>
        <hr class="divider" />

        <form id="login-form">

          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
            />
            <label for="email">Email address</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <label for="password">Password</label>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-dark btn-xl">
              Login
            </button>
          </div>
<div class="row mt-4">
    <div class="col-md-6 mb-3">
        <div class="card login-demo-card admin-card" style="cursor: pointer;" 
             onclick="toggleAdminCredentials()">
            <div class="card-body text-center p-3">
                <div class="demo-icon mb-2">
                    <i class="bi bi-shield-check text-dark" style="font-size: 2rem;"></i>
                </div>
                <h6 class="card-title mb-1">Admin Demo</h6>
                <div class="text-dark small">
                    <i class="bi bi-eye me-1"></i> Show credentials
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-6 mb-3">
        <div class="card login-demo-card user-card" style="cursor: pointer;" 
             onclick="toggleUserCredentials()">
            <div class="card-body text-center p-3">
                <div class="demo-icon mb-2">
                    <i class="bi bi-person-check text-dark" style="font-size: 2rem;"></i>
                </div>
                <h6 class="card-title mb-1">User Demo</h6>
                <div class="text-dark small">
                    <i class="bi bi-eye me-1"></i> Show credentials
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Admin credentials (hidden by default) -->
<div id="adminCredentials" class="mt-3 p-3 border rounded bg-light" style="display: none;">
    <h6><i class="bi bi-shield-check text-primary me-2"></i>Admin Credentials</h6>
    <div class="row">
        <div class="col-md-6">
            <strong>Email:</strong> <code>admin@test.com</code>
        </div>
        <div class="col-md-6">
            <strong>Password:</strong> <code>admin1234</code>
        </div>
    </div>
    <div class="mt-2">
        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="hideAdminCreds()">
            <i class="bi bi-x me-1"></i> Hide
        </button>
    </div>
</div>

<div id="userCredentials" class="mt-3 p-3 border rounded bg-light" style="display: none;">
    <h6><i class="bi bi-person-check text-success me-2"></i>User Credentials</h6>
    <div class="row">
        <div class="col-md-6">
            <strong>Email:</strong> <code>user@test.com</code>
        </div>
        <div class="col-md-6">
            <strong>Password:</strong> <code>user1234</code>
        </div>
    </div>
    <div class="mt-2">

        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="hideUserCreds()">
            <i class="bi bi-x me-1"></i> Hide
        </div>
    </div>
</div>

        </form>

      </div>
    </div>
  </div>
</section>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

<script src="utils/constants.js"></script>
<script src="services/user-service.js"></script>
<script src="assets/js/login.js"></script>

<script>
  UserService.init();
</script>

</body>
</html>
