<section class="page-section bg-light" id="register">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bolder">Create Account</h2>
              <p class="text-muted">Join Explore.ba today</p>
            </div>

            <form id="registerForm">
              <div class="form-floating mb-3">
                <input class="form-control border-0 bg-light" id="registerName" name="name" type="text" placeholder="Your name" required />
                <label for="registerName" class="text-muted">Full name</label>
              </div>

              <div class="form-floating mb-3">
                <input class="form-control border-0 bg-light" id="registerEmail" name="email" type="email" placeholder="name@example.com" required />
                <label for="registerEmail" class="text-muted">Email address</label>
              </div>

              <div class="form-floating mb-3">
                <input class="form-control border-0 bg-light" id="registerPassword" name="password" type="password" placeholder="Password" required />
                <label for="registerPassword" class="text-muted">Password</label>
              </div>

              <div class="form-floating mb-4">
                <input class="form-control border-0 bg-light" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" required />
                <label for="confirmPassword" class="text-muted">Confirm Password</label>
              </div>

              <div class="d-grid mb-3">
                <button class="btn btn-dark btn-xl py-3 fw-bold text-uppercase" type="submit">
                  Sign Up
                </button>
              </div>

              <div class="text-center">
                <span class="small text-muted">Already have an account? </span>
                <a href="#login" class="small fw-bold text-dark text-decoration-none">Login here</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
