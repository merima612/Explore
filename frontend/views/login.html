<section class="page-section bg-light min-vh-100 d-flex align-items-center" id="login">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bolder">Welcome back!</h2>
              <p class="text-muted">Login to manage your account</p>
            </div>

            <form id="login-form">
              <div class="form-floating mb-3">
                <input type="email" class="form-control border-0 bg-light" name="email" placeholder="name@example.com" required />
                <label class="text-muted">Email address</label>
              </div>

              <div class="form-floating mb-4">
                <input type="password" class="form-control border-0 bg-light" name="password" placeholder="Enter your password" required />
                <label class="text-muted">Password</label>
              </div>

              <div class="d-grid mb-4">
                <button type="submit" class="btn btn-dark btn-xl py-3 fw-bold text-uppercase">
                  Login
                </button>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <div class="p-2 border rounded bg-light text-center" style="cursor: pointer;" onclick="$('#adminCredentials').toggle()">
                    <small class="fw-bold d-block">Admin Demo</small>
                  </div>
                </div>
                <div class="col-6">
                  <div class="p-2 border rounded bg-light text-center" style="cursor: pointer;" onclick="$('#userCredentials').toggle()">
                    <small class="fw-bold d-block">User Demo</small>
                  </div>
                </div>
              </div>

              <div id="adminCredentials" class="mb-3 p-3 border rounded bg-light" style="display: none;">
                <code>admin@test.com</code> / <code>Admin1234</code>
              </div>
              <div id="userCredentials" class="mb-3 p-3 border rounded bg-light" style="display: none;">
                <code>user@test.com</code> / <code>User1234</code>
              </div>

              <div class="text-center mt-3">
                <span class="small text-muted">Don't have an account? </span>
                <a href="#register" class="small fw-bold text-dark text-decoration-none">Register here</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>

  UserService.init();
</script>
